name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm & GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Upgrade npm for Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm run check

      - run: npm test

      - name: Bump version & push tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW_TAG=$(npm version "${{ inputs.bump }}")
          git push origin HEAD:master --follow-tags
          echo "RELEASE_TAG=$NEW_TAG" >> "$GITHUB_ENV"

      - name: Verify tag matches package.json (tag push)
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "Tag ($GITHUB_REF_NAME) does not match package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Publish to npm (OIDC Trusted Publishing)
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$RELEASE_TAG" --generate-notes
